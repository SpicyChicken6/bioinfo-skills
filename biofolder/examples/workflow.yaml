schema_version: 1
project:
  id: example-multimodal-study
  name: Example multimodal bioinformatics project
  description: Compare modality-specific measurements after sample alignment and quality control.
tasks:
  - id: rna-qc
    title: Transcriptomics quality control
    goal: Produce quality assessments and identify usable RNA samples.
    status: todo
    depends_on: []
    inputs:
      - ../data/metadata/sample_manifest.tsv
      - ../modules/transcriptomics/data/raw/counts.tsv
    outputs:
      - ../modules/transcriptomics/tasks/01-quality-control/agent/tables/sample_qc.tsv
    notes: >-
      Task README: ../modules/transcriptomics/tasks/01-quality-control/README.md.
      The output is an anticipated agent candidate. Human comparison and accepted
      results are recorded in the shared task README; no acceptance is implied.
  - id: protein-qc
    title: Proteomics quality control
    goal: Produce quality assessments and identify usable proteomics samples.
    status: todo
    depends_on: []
    inputs:
      - ../data/metadata/sample_manifest.tsv
      - ../modules/proteomics/data/raw/abundance.tsv
    outputs:
      - ../modules/proteomics/tasks/01-quality-control/agent/tables/sample_qc.tsv
    notes: >-
      Task README: ../modules/proteomics/tasks/01-quality-control/README.md.
      The output is an anticipated agent candidate, not an accepted result.
  - id: integration-sample-alignment
    title: Align samples across modalities
    goal: Document matched samples, missing modalities, and inclusion decisions.
    status: todo
    depends_on: [rna-qc, protein-qc]
    inputs:
      - ../data/metadata/modality_mapping.tsv
      - Accepted RNA QC result referenced by ../modules/transcriptomics/tasks/01-quality-control/README.md
      - Accepted proteomics QC result referenced by ../modules/proteomics/tasks/01-quality-control/README.md
    outputs:
      - ../modules/multimodal-integration/tasks/01-sample-alignment/agent/data/processed/matched_samples.tsv
    notes: >-
      Task README: ../modules/multimodal-integration/tasks/01-sample-alignment/README.md.
      Resolve the accepted upstream artifacts before a requested run. Update this
      plan to concrete paths only when a plan update is requested. This example
      does not choose between human and agent results or prescribe a joint-analysis method.
