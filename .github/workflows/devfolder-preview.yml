name: Devfolder preview writer

on:
  pull_request:
    paths:
      - devfolder/assets/preview_workflow.py
      - tests/test_devfolder_preview.py
      - .github/workflows/devfolder-preview.yml
  push:
    branches: [main]
    paths:
      - devfolder/assets/preview_workflow.py
      - tests/test_devfolder_preview.py
      - .github/workflows/devfolder-preview.yml

permissions:
  contents: read

jobs:
  preview-writer:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -p test_devfolder_preview.py -v
